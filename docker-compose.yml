services:
  app:
    build: .
    ports:
      - "5173:5173"
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/server/node_modules
      - /app/client/node_modules
    environment:
      # Bind-mounted files don't always emit change events; poll instead.
      - TSC_WATCHFILE=DynamicPriorityPolling
      - TSC_WATCHDIRECTORY=DynamicPriorityPolling
